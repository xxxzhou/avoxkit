name: avoxkit
description: "Free, local, private audio & video toolbox."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  ffi: ^2.2.0
  file_selector: ^1.1.0
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/avoxkit-demo.mp4
    - assets/i18n/
  fonts:
    - family: Albert Sans
      fonts:
        - asset: assets/fonts/albertsans.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono.ttf
